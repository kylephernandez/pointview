[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pointview"
version = "0.1.0"
description = "Real-world labels for VITURE Luma Ultra glasses, with an iPhone pointer"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.18; sys_platform != 'win32'",
  "onnxruntime-directml>=1.18; sys_platform == 'win32'",
  "PySide6-Essentials>=6.7",
  "websockets>=13",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "sgp4>=2.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["pointview*"]

[tool.setuptools.package-data]
pointview = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "network: needs live internet (skipped unless POINTVIEW_NETWORK_TESTS=1)",
  "model: needs the downloaded ONNX model (skipped if missing)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # formatter owns line length; allow °, ×, − in text
