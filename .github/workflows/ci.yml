name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  laptop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laptop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laptop/pyproject.toml
      - name: System libraries for Qt offscreen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -ra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: laptop/test-output/
          if-no-files-found: ignore

  phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest --ci
